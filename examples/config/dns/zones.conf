// Layout example for 192.0.2.10/24 and zones.list containing super.local.
// Generated on the Pi; these example addresses are never deployment inputs.
zone "super.local" {
    type primary;
    file "/etc/bind/pi-set-go/db.super.local";
    allow-update { none; };
};
zone "2.0.192.in-addr.arpa" {
    type primary;
    file "/etc/bind/pi-set-go/db.2.0.192.in-addr.arpa";
    allow-update { none; };
};
